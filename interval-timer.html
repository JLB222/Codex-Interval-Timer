<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f1">
  <title>Interval — Workout Timer</title>
  <link rel="stylesheet" href="interval-timer.css">
</head>
<body>
  <main class="app">
    <header><div class="brand"><span class="brand-mark">↗</span> interval</div><div class="tag">A little focus, one round at a time.</div></header>
    <section class="card" aria-label="Workout interval timer">
      <div class="timer" id="timerPanel">
        <div class="phase" id="phase"><span class="dot"></span><span id="phaseText">Ready</span></div>
        <div class="clock" id="clock" aria-live="polite">00:30</div>
        <div class="round" id="roundText">Round <strong>1</strong> of <strong>8</strong></div>
        <div class="progress" id="progress" aria-hidden="true"></div>
        <div class="controls">
          <button class="primary" id="startBtn">Start workout</button>
          <button class="secondary" id="resetBtn">Reset</button>
        </div>
      </div>
      <div class="settings">
        <div class="settings-head"><h2>Workout setup</h2><span class="settings-note">Adjust any time before you start</span></div>
        <div class="fields">
          <div class="field"><label for="rounds">Number of rounds</label><div class="input-row"><input id="rounds" type="number" min="1" max="50" value="8"><span class="unit">rounds</span></div></div>
          <div class="field"><label for="active">Active interval</label><div class="input-row"><input id="active" type="number" min="1" max="5999" value="30"><span class="unit">seconds</span></div></div>
          <div class="field"><label for="rest">Rest interval</label><div class="input-row"><input id="rest" type="number" min="1" max="5999" value="15"><span class="unit">seconds</span></div></div>
        </div>
        <div class="hint">Each round includes one active interval and one rest interval.</div>
      </div>
    </section>
  </main>
  <script src="interval-timer.js" defer></script>
</body>
</html>
